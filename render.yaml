# One-click deploy on Render: Blueprints > New > point at this repository.
#
# Everything below is free-tier. Two things to know before relying on it:
#   - a free web service sleeps after 15 minutes idle, so the first request
#     after a quiet spell waits for a cold start;
#   - Render's free Postgres expires, and the database goes with it.
# Fine for a portfolio demo, not for anything that matters.

databases:
  - name: digital-bank-db
    databaseName: bank
    user: bank
    plan: free

services:
  - type: web
    name: digital-bank-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: digital-bank-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Seed the two demo accounts so a visitor has somewhere to log in.
      - key: DEMO_SEED
        value: "true"
      # Strangers enrol real biometric data on a public demo. Keep it for a day,
      # no longer — the retention job deletes anything older.
      - key: FACE_RETENTION_HOURS
        value: "24"
      # Set this to the deployed front end's exact origin once it is live.
      - key: CORS_ORIGINS
        sync: false
