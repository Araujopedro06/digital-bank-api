spring:
  datasource:
    url: jdbc:h2:mem:bank-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

app:
  face:
    match-threshold: 0.45
  jwt:
    secret: test-only-secret-key-that-is-long-enough-for-hs256
    expiration: 1h
  cors:
    allowed-origins: >-
      http://localhost:*,https://localhost:*,
      http://127.0.0.1:*,https://127.0.0.1:*,
      http://192.168.*.*:*,https://192.168.*.*:*,
      http://10.*.*.*:*,https://10.*.*.*:*,
      http://172.16.*.*:*,https://172.16.*.*:*
