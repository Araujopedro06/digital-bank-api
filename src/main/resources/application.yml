spring:
  application:
    name: digital-bank-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

spring.servlet.multipart:
  max-file-size: 2MB
  max-request-size: 3MB

app:
  demo:
    # Seeds two accounts so a visitor has something to log into. On in dev; the
    # public demo turns it on too, a real deployment would not.
    seed: ${DEMO_SEED:false}
  face:
    # Hours to keep an enrolled face before deleting it, 0 to keep indefinitely.
    # The public demo sets this: strangers enrol real biometric data there, and
    # keeping it any longer than the visit needs would be indefensible.
    retention-hours: ${FACE_RETENTION_HOURS:0}
    # Euclidean distance between face-api.js descriptors below which two faces are
    # taken to be the same person.
    #
    # Calibrated against 21 real faces — 210 different-person pairs — by
    # tools/face-threshold-eval in the web repo. False accepts over those pairs:
    #
    #   0.45 -> 0      0.50 -> 1      0.55 -> 4      0.60 -> 15
    #
    # 0.60 is face-api.js's general-purpose default and lets a stranger through
    # 7% of the time, which is fine for photo tagging and not for a bank. The
    # closest different-person pair measured 0.471, so 0.45 keeps a margin.
    # Raise it if legitimate users get rejected too often: a retry costs seconds,
    # a false accept costs someone their balance.
    match-threshold: 0.45
  jwt:
    # Override in every real environment. Must be at least 32 bytes for HS256.
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-only-secret-key}
    expiration: 2h
  cors:
    # Overridden per profile below. Prod should list exact origins.
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        # Health only. The rest of actuator is not something to expose publicly.
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # On disk, not in memory: an enrolled face and an uploaded photo have to
    # survive a restart of the API, or testing the flows means redoing them every
    # time. Delete ./data to get a clean seeded database back.
    url: jdbc:h2:file:./data/bank;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true

app:
  demo:
    seed: true
  cors:
    # Any localhost port, plus the private ranges, so the app can be opened from
    # a phone on the same Wi-Fi without pinning today's IP address. Dev only —
    # the prod profile takes an explicit list from CORS_ORIGINS.
    allowed-origins: >-
      http://localhost:*,https://localhost:*,
      http://127.0.0.1:*,https://127.0.0.1:*,
      http://192.168.*.*:*,https://192.168.*.*:*,
      http://10.*.*.*:*,https://10.*.*.*:*,
      http://172.16.*.*:*,https://172.16.*.*:*

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Left blank on purpose. DatabaseUrlEnvironmentPostProcessor fills these from
    # DATABASE_URL when the host provides a postgres:// connection string; set
    # them explicitly instead if you have the parts separately.
    url: ${DATABASE_URL:}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
