name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Includes PostgresSchemaTest, which starts a real PostgreSQL of its own —
      # no service container needed.
      - name: Test
        run: mvn -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Proves the image the host will build actually builds.
      - name: Build image
        run: docker build -t digital-bank-api:ci .
